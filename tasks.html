<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow - وظایف</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>✅ مدیریت وظایف</h1><a href="index.html">خانه</a></header>
<main><section class="task-form"><h2>وظیفه</h2>
<form id="taskForm">
<label for="taskTitle">عنوان:</label><input id="taskTitle" required>
<label for="taskPriority">اولویت:</label><select id="taskPriority"><option value="low">کم</option><option value="medium">متوسط</option><option value="high">زیاد</option></select>
<label for="taskDueDate">تاریخ:</label><input type="date" id="taskDueDate" required>
<label for="taskTime">ساعت:</label><input type="time" id="taskTime" required>
<button id="saveTask" type="submit">افزودن وظیفه</button><button id="cancelEdit" type="button" hidden>لغو ویرایش</button>
</form></section>
<section class="task-list"><h2>فهرست وظایف</h2><p id="reminderStatus" role="status" aria-live="polite"></p><ul id="tasksContainer"></ul></section>
<section class="task-list"><h2>پشتیبان‌گیری</h2>
<button id="exportTasks" type="button">⬇️ دریافت JSON</button>
<label>بازیابی JSON <input id="importTasks" type="file" accept="application/json,.json"></label>
</section></main>
<footer><a href="https://github.com/AminAskariX/TaskFlow">پروژه در گیت‌هاب</a></footer>
<script src="dataHandler.js"></script><script src="app.js"></script></body></html>
